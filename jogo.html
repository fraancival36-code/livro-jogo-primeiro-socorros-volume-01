<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME — Primeiros Socorros</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; padding: 15px; }
        .status { display: flex; gap: 15px; margin: 10px 0; font-size: 16px; }
        .hp { color: #ff4444; font-weight: bold; }
        .cena-num { color: #4fc3f7; }
        .bloco-cena { background: #0a0a20; border-radius: 12px; padding: 20px; margin: 20px 0; }
        .titulo { font-size: 22px; color: #ffcc00; text-align: center; margin-bottom: 15px; }
        .imagem { width: 100%; height: 180px; background: #223; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .texto { font-size: 17px; line-height: 1.6; margin-bottom: 20px; }
        .opcao { padding: 14px; margin: 10px 0; border: 2px solid #444; border-radius: 10px; cursor: pointer; font-size: 16px; }
        .opcao:hover { border-color: #666; }
        .letra { font-weight: bold; font-size: 18px; margin-right: 10px; }
        .escondido { display: none !important; }
        .inicio { text-align: center; padding-top: 100px; }
        .btn-iniciar { padding: 20px 50px; font-size: 22px; background: #ff4444; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<!-- TELA DE INÍCIO -->
<div id="tela-inicio" class="inicio">
    <h1 style="font-size: 48px; margin-bottom: 20px;">PRIME</h1>
    <h2 style="color: #ff4444; margin-bottom: 40px;">PRIMEIROS SOCORROS</h2>
    <button class="btn-iniciar" onclick="iniciarJogo()">🚑 INICIAR JOGO</button>
</div>

<!-- TELA DO JOGO -->
<div id="tela-jogo" class="escondido">
    <div class="status">
        <span class="hp">❤️ HP: <span id="valor-hp">10</span>/10</span>
        <span class="cena-num">📍 Cena <span id="valor-cena">1</span> de 5</span>
    </div>

    <div class="bloco-cena">
        <h3 id="cena-titulo" class="titulo">Título da Cena 1</h3>
        <div id="cena-imagem" class="imagem">🚗</div>
        <p id="cena-texto" class="texto">Texto da situação 1...</p>
        
        <div id="opcoes">
            <div class="opcao" onclick="responder(0)"><span class="letra">A</span>Opção A1</div>
            <div class="opcao" onclick="responder(1)"><span class="letra">B</span>Opção B1</div>
            <div class="opcao" onclick="responder(2)"><span class="letra">C</span>Opção C1</div>
            <div class="opcao" onclick="responder(3)"><span class="letra">D</span>Opção D1</div>
            <div class="opcao" onclick="responder(4)"><span class="letra">E</span>Opção E1</div>
        </div>
    </div>
</div>

<script>
// ==============================================
// BANCO DE CENAS — AQUI FICA TODO O CONTEÚDO
// ==============================================
const CENAS = [
    {
        titulo: "🚗 ACIDENTE DE TRÂNSITO",
        icone: "🚗",
        texto: "Você chega ao local de um acidente. Um carro bateu em um poste. Há uma pessoa caída no chão, queixando-se de dor na perna direita.",
        opcoes: [
            { texto: "Correr imediatamente até a vítima no meio da pista.", hp: -1 },
            { texto: "Sinalizar o local e ligar para o SAMU (192).", hp: +1 },
            { texto: "Puxar a vítima pela perna para tirá-la da pista.", hp: -2 },
            { texto: "Dar água e tentar fazer a vítima andar.", hp: -1 },
            { texto: "Deixar a vítima e ir buscar ajuda longe dali.", hp: -1 }
        ]
    },
    {
        titulo: "⚡ FIOS ELÉTRICOS CAÍDOS",
        icone: "⚡",
        texto: "Uma tempestade derrubou fios de alta tensão. Um fio está no chão soltando faíscas. Uma pessoa se aproxima sem perceber o perigo.",
        opcoes: [
            { texto: "Pegar o fio com a mão para afastar.", hp: -3 },
            { texto: "Gritar para a pessoa parar e manter distância mínima de 10 metros.", hp: +1 },
            { texto: "Puxar a pessoa pela roupa para tirar dali.", hp: -2 },
            { texto: "Chutar o fio com o pé.", hp: -2 },
            { texto: "Ignorar e seguir caminho.", hp: -1 }
        ]
    },
    {
        titulo: "🩸 HEMORRAGIA FORTE",
        icone: "🩸",
        texto: "Uma pessoa sofreu um corte profundo no braço e o sangue jorra sem parar.",
        opcoes: [
            { texto: "Lavar com água e esperar parar sozinho.", hp: -1 },
            { texto: "Fazer pressão direta no local com pano limpo.", hp: +1 },
            { texto: "Amarrar fio fino acima do corte.", hp: -2 },
            { texto: "Colocar algodão em cima do corte.", hp: 0 },
            { texto: "Deixar sangrar para limpar.", hp: -3 }
        ]
    },
    {
        titulo: "🔥 QUEIMADURA QUENTE",
        icone: "🔥",
        texto: "Uma pessoa tocou em panela quente e a pele está vermelha e dolorida.",
        opcoes: [
            { texto: "Colocar manteiga ou pasta de dente.", hp: -2 },
            { texto: "Colocar sob água corrente fria por 10 minutos.", hp: +1 },
            { texto: "Estourar as bolhas se aparecerem.", hp: -2 },
            { texto: "Cobrir com curativo fechado.", hp: 0 },
            { texto: "Passar gelo direto na pele.", hp: -1 }
        ]
    },
    {
        titulo: "💓 PARADA CARDÍACA",
        icone: "💓",
        texto: "Uma pessoa caiu no chão, não responde, não respira. O peito não se move.",
        opcoes: [
            { texto: "Dar água e esperar acordar.", hp: -2 },
            { texto: "Ligar 192 e iniciar massagem cardíaca imediatamente.", hp: +1 },
            { texto: "Sacudir a pessoa para acordar.", hp: -1 },
            { texto: "Colocar deitada de lado e esperar.", hp: 0 },
            { texto: "Correr buscar ajuda e deixar a pessoa sozinha.", hp: -1 }
        ]
    }
];

// ==============================================
// ESTADO DO JOGO
// ==============================================
let estado = {
    hp: 10,
    cenaAtual: 0,
    totalCenas: CENAS.length
};

// ==============================================
// 🎯 FUNÇÃO PRINCIPAL — CARREGA A CENA NA TELA
// ==============================================
function carregarCena() {
    // PEGA A CENA ATUAL — USA O ÍNDICE QUE ESTÁ AVANÇANDO
    const cena = CENAS[estado.cenaAtual];
    
    if (!cena) {
        alert("🎉 JOGO FINALIZADO! Você passou por todas as cenas!");
        return;
    }

    // ✅ TROCA TUDO — TÍTULO, IMAGEM, TEXTO, OPÇÕES, NÚMERO, HP
    document.getElementById("cena-titulo").textContent = cena.titulo;
    document.getElementById("cena-imagem").textContent = cena.icone;
    document.getElementById("cena-texto").textContent = cena.texto;
    document.getElementById("valor-cena").textContent = estado.cenaAtual + 1;
    document.getElementById("valor-hp").textContent = estado.hp;

    // ✅ TROCA AS 5 OPÇÕES A–E
    const divOpcoes = document.getElementById("opcoes");
    divOpcoes.innerHTML = ""; // APAGA AS VELHAS PRIMEIRO!

    const letras = ["A", "B", "C", "D", "E"];
    cena.opcoes.forEach((op, i) => {
        divOpcoes.innerHTML += `
            <div class="opcao" onclick="responder(${i})">
                <span class="letra">${letras[i]}</span>${op.texto}
            </div>
        `;
    });
}

// ==============================================
// ✅ RESPONDER E AVANÇAR — CHAMA CARREGAR CENA DE NOVO!
// ==============================================
function responder(indiceOpcao) {
    const cena = CENAS[estado.cenaAtual];
    const hpMudanca = cena.opcoes[indiceOpcao].hp;
    
    estado.hp = Math.max(0, Math.min(10, estado.hp + hpMudanca));
    
    // AVANÇA PARA PRÓXIMA CENA
    estado.cenaAtual++;
    
    // ✅ CHAMA A FUNÇÃO QUE TROCA TUDO — SEM FALTA ISSO!
    carregarCena();
}

// ==============================================
// ▶️ INICIAR O JOGO
// ==============================================
function iniciarJogo() {
    estado = { hp: 10, cenaAtual: 0, totalCenas: CENAS.length };
    document.getElementById("tela-inicio").classList.add("escondido");
    document.getElementById("tela-jogo").classList.remove("escondido");
    
    // ✅ CARREGA A PRIMEIRA CENA
    carregarCena();
}
</script>

</body>
</html>
