<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio — Primeiros Socorros</title>
    <meta name="author" content="FRANCIVAL ALVES FARIAS">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <header class="cabecalho">
            <button class="btn-terceiro" style="width:auto; padding:8px 12px; margin:0;" onclick="voltarMenu()">← Voltar</button>
            <p class="autor" style="margin-top:10px;">Autor: <span>FRANCIVAL ALVES FARIAS</span></p>
            <h2 id="titulo-volume">Volume 1 — Primeiros Socorros</h2>
            <div class="progresso-barra">
                <div class="progresso-preenchimento" id="barraProgresso" style="width:0%"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin:8px 0;">
                <span id="contadorDesafio">001 / 060</span>
                <span class="pontos">⭐ <span id="pontos">0</span> pts</span>
            </div>
        </header>

        <span class="categoria" id="categoria">Segurança da Cena</span>
        <div class="cenario" id="cenario">Carregando...</div>
        <div class="aviso-risco">
            ⚠️ <strong>Risco Imediato:</strong> <span id="riscoImediato">Carregando...</span>
        </div>
        <h3 class="pergunta">Qual é a sua decisão?</h3>
        <div id="alternativas">
            <p style="text-align:center; color:#94a3b8;">Carregando desafio...</p>
        </div>
        <div class="aviso-legal">
            ⚠️ Não substitui atendimento médico, SAMU (192) ou Bombeiros (193).
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
