<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeiros Socorros — Jogo</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- 📊 BARRA SUPERIOR — HP + PROGRESSO -->
  <header class="barra-superior">
    <div class="hp-container">
      <span class="hp-icone">❤️</span>
      <div class="hp-barra-fundo">
        <div id="hpBarra" class="hp-barra" style="width: 100%"></div>
      </div>
      <span id="hpTexto" class="hp-texto">10/10</span>
    </div>
    
    <div class="progresso-container">
      <span class="cena-texto">Cena <span id="cenaAtual">1</span> de <span id="totalCenas">60</span></span>
      <div class="barra-progresso-fundo">
        <div id="barraProgresso" class="barra-progresso" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <main class="conteudo-jogo">
    <!-- 📂 CATEGORIA -->
    <div class="categoria">
      <span id="categoria">Segurança da Cena</span>
    </div>

    <!-- 📸 IMAGEM DA CENA -->
    <div class="container-imagem">
      <img id="imagemCena" src="" alt="Cena da situação" class="imagem-cena">
    </div>

    <!-- 📖 TÍTULO + SITUAÇÃO -->
    <h2 id="tituloCena" class="titulo-cena">Situação de Emergência</h2>
    <p id="cenario" class="texto-cenario">Carregando...</p>

    <!-- ⚠️ AVISO DE RISCO -->
    <div id="avisoRisco" class="aviso-risco">
      ⚠️ Atenção ao risco!
    </div>

    <!-- ✅ CONSEQUÊNCIA (aparece após escolha) -->
    <div id="consequencia" class="consequencia" style="display: none;"></div>

    <!-- 🅰️🅱️🅲🅳🅴 ALTERNATIVAS — ORDEM FIXA! -->
    <div id="alternativas" class="container-alternativas">
      <!-- Botões gerados pelo sistema.js -->
    </div>

    <!-- 💾 PONTOS + MENU INFERIOR -->
    <footer class="barra-inferior">
      <div class="pontos">💾 <span id="pontos">0</span> pontos</div>
      <div class="botoes-inferiores">
        <button onclick="window.location.href='index.html'" class="btn-inferior">🏠 Sair</button>
        <button class="btn-inferior" style="display:none;">💡 Dica</button>
      </div>
    </footer>
  </main>

  <script src="sistema.js"></script>
  <script>
    window.onload = iniciarJogo;
  </script>
</body>
</html>
