<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRIME — Primeiros Socorros</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* SEM ROLAGEM — tudo numa tela só */
        }
        .tela {
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 932px; /* PROPORÇÃO 9:16 EXATA */
            margin: 0 auto;
            background: linear-gradient(180deg, #0F3460 0%, #1A5F7A 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            color: #fff;
            padding: 12px 16px 24px;
        }

        /* === FUNDO DA IMAGEM === */
        .fundo-imagem {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 38%;
            background: linear-gradient(180deg, rgba(15,52,96,0.3) 0%, rgba(26,95,122,0.95) 100%),
                        url('assets/fundo-medico.jpg') center/cover no-repeat;
            z-index: 1;
        }

        /* === CABEÇALHO === */
        .cabecalho {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .menu-btn, .config-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            flex-shrink: 0;
        }
        .referencia-emergencia {
            display: flex;
            gap: 8px;
        }
        .etiqueta-ref {
            padding: 6px 12px;
            border-radius: 16px;
            background: #FF3B30;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(255,59,48,0.25);
        }
        .idioma-btn {
            padding: 6px 16px;
            border-radius: 14px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(6px);
            cursor: pointer;
        }

        /* === TÍTULO === */
        .titulo-secao {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 6px 0 10px;
        }
        .titulo {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.2);
            margin-bottom: 4px;
        }
        .subtitulo {
            font-size: 14px;
            color: #E0F2F1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* === INDICADORES === */
        .indicadores {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 0 14px;
            flex-wrap: wrap;
        }
        .indicador {
            padding: 6px 14px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(6px);
        }

        /* === 6 BOTÕES PRINCIPAIS — NOMES EXATOS, CAMINHOS FIXOS === */
        .botoes-motores {
            position: relative;
            z-index: 3;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            flex: 1;
        }
        .botao-motor {
            background: #fff;
            color: #0F3460;
            border-radius: 16px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: transform 0.15s, box-shadow 0.15s;
            min-height: 110px;
        }
        .botao-motor:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
        }
        .botao-motor .icone {
            font-size: 26px;
            margin-bottom: 4px;
        }
        .botao-motor .titulo-btn {
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
        }
        .botao-motor .desc-btn {
            font-size: 12px;
            color: #4A6FA5;
            text-align: center;
            line-height: 1.3;
        }

        /* === RODAPÉ === */
        .rodape {
            position: relative;
            z-index: 3;
            text-align: center;
            padding-top: 10px;
            font-size: 13px;
            color: #B2EBF2;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="tela">

    <!-- FUNDO -->
    <div class="fundo-imagem"></div>

    <!-- CABEÇALHO -->
    <div class="cabecalho">
        <button class="menu-btn">☰</button>
        <div style="text-align: center;">
            <div class="referencia-emergencia">
                <span class="etiqueta-ref">🚑 SAMU 192</span>
                <span class="etiqueta-ref">🚒 BOMBEIROS 193</span>
            </div>
            <button class="idioma-btn" onclick="mudarIdioma()">🌐 PT-BR</button>
        </div>
        <button class="config-btn">⚙️</button>
    </div>

    <!-- TÍTULO -->
    <div class="titulo-secao">
        <h1 class="titulo">PRIMEIROS SOCORROS</h1>
        <p class="subtitulo">TREINE. DECIDA. SALVE VIDAS.</p>
    </div>

    <!-- INDICADORES -->
    <div class="indicadores">
        <span class="indicador">🎮 60 CENAS</span>
        <span class="indicador">⏱️ TREINAMENTO POR TEMPO</span>
        <span class="indicador">📋 PROTOCOLO XABCDE</span>
    </div>

    <!-- 6 BOTÕES — NOMES EXATOS + CAMINHOS FIXOS -->
    <div class="botoes-motores">

        <!-- BOTÃO 1 → MOTOR 01 JOGO -->
        <button class="botao-motor" onclick="abrirMotor('motor01')">
            <span class="icone">🎮</span>
            <span class="titulo-btn">COMEÇAR O JOGO</span>
            <span class="desc-btn">Treinamento interativo</span>
        </button>

        <!-- BOTÃO 2 → MOTOR 02 CONSULTA -->
        <button class="botao-motor" onclick="abrirMotor('motor02')">
            <span class="icone">🔍</span>
            <span class="titulo-btn">CONSULTAR</span>
            <span class="desc-btn">Conhecimentos e protocolos</span>
        </button>

        <!-- BOTÃO 3 → MOTOR 03 LIVRO -->
        <button class="botao-motor" onclick="abrirMotor('motor03')">
            <span class="icone">📖</span>
            <span class="titulo-btn">LIVRO OFICIAL</span>
            <span class="desc-btn">Material completo</span>
        </button>

        <!-- BOTÃO 4 → MOTOR 04 APOIADORES -->
        <button class="botao-motor" onclick="abrirMotor('motor04')">
            <span class="icone">🤝</span>
            <span class="titulo-btn">APOIADORES</span>
            <span class="desc-btn">Apoio aos projetos</span>
        </button>

        <!-- BOTÃO 5 → MOTOR 05 CHECKLIST -->
        <button class="botao-motor" onclick="abrirMotor('motor05')">
            <span class="icone">📋</span>
            <span class="titulo-btn">CHECKLIST DE EMERGÊNCIA</span>
            <span class="desc-btn">Verificação e registro</span>
        </button>

        <!-- BOTÃO 6 → MOTOR 06 EXPANSÃO -->
        <button class="botao-motor" onclick="abrirMotor('motor06')">
            <span class="icone">📊</span>
            <span class="titulo-btn">MOTOR 6</span>
            <span class="desc-btn">Reserva / Futuro</span>
        </button>

    </div>

    <!-- RODAPÉ -->
    <div class="rodape">
        AUTOR: FRANCIVAL ALVES FARIAS
    </div>

</div>

<script>
// 🔒 CAMINHOS OFICIAIS — CONGELADOS. NÃO ALTERAR.
const CAMINHOS = {
    motor01: '../MOTOR_01_JOGO/index.html',
    motor02: '../MOTOR_02_CONSULTA/index.html',
    motor03: '../MOTOR_03_LIVRO/index.html',
    motor04: '../MOTOR_04_APOIADORES/index.html',
    motor05: '../MOTOR_05_CHECKLIST/index.html',
    motor06: '../MOTOR_06_EXPANSAO/index.html'
};

// 🎯 ABRIR MOTOR — SÓ SEGUE O CAMINHO FIXO
function abrirMotor(motor) {
    const caminho = CAMINHOS[motor];
    if (caminho) {
        // Em desenvolvimento: mostra para onde vai
        // alert(`Abrindo: ${caminho}`);
        window.location.href = caminho;
    } else {
        alert('❌ Caminho não definido: ' + motor);
    }
}

function mudarIdioma() {
    alert('🌐 Idioma atual: Português (Brasil)');
}
</script>

</body>
</html>
